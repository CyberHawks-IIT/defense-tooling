# The discord_alert custom alert action app, deployed by defense-tooling's
# splunk_indexer role when discord_webhook_url is set. Posts each fired
# detection to a Discord channel webhook as a rich embed.
[install]
is_configured = 1

[ui]
is_visible = 0
label = CyberHawks Discord Alert Action

[launcher]
author = defense-tooling
description = Custom alert action: post fired Splunk alerts to a Discord webhook as embeds.
version = 1.0.0
