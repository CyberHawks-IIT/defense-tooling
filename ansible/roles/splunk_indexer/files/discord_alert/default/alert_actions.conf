# Defines the discord_alert custom alert action. The webhook URL is NOT here
# (it's a secret) -- the splunk_indexer role deploys it into local/alert_actions.conf
# from discord_webhook_url. Splunk merges local over default, so the live action
# gets the URL without it ever living in this committed file.
[discord_alert]
is_custom = 1
label = Discord
description = Post the fired alert to a Discord channel webhook as an embed.
payload_format = json
# Placeholder; the real value is set in local/alert_actions.conf by Ansible.
param.webhook_url =
# Digest mode only: most rows posted per fired alert (in messages of 10 embeds).
param.max_rows = 50
# 1 = post only the payload's `result` row (per-result alerting, one embed per
# attempt, each throttled on its own fields). splunk-detections sets this on
# every detection; digest-mode searches leave it 0.
param.per_result = 0
# Result column holding the attacker IP(s) for the embed description. A search
# whose table has no attacker_ip column overrides this per saved search.
param.attacker_field = attacker_ip
