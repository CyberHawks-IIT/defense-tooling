# Deployed by the splunk_indexer role to dt_detection_content/local/eventtypes.conf.
#
# Only covers gaps confirmed NOT already provided by the installed add-ons
# (Splunk_TA_windows, Splunk_TA_microsoft_sysmon) -- see CLAUDE.md's
# monitoring rollout plan step 4 for the full confirm-then-fill pass this
# came from, including which backlog.md rows are already served by the
# add-ons' own eventtypes (cited there, not duplicated here). Every stanza
# below is commented with the backlog.md row it exists for.
#
# Field names (AttributeLDAPDisplayName, ObjectClass, Properties, etc.) are
# standard Windows Security-log auditing fields, auto-extracted by Splunk's
# default key-value extraction against classic WinEventLog text -- no
# add-on-specific EXTRACT was needed or found for them.

## Internal base eventtype every dt_* Security-log eventtype below builds on
## -- not itself tied to a single backlog.md row.
[win_security_base]
search = source="WinEventLog:Security" OR source="XmlWinEventLog:Security"

## DCSync -- Windows Events 4662 (action) + Zeek conn.log (IP)
## 4662 alone is extremely common (any AD read trips it); the two
## DS-Replication-Get-Changes* extended-rights GUIDs are the actual DCSync
## signal.
[dt_dcsync]
search = eventtype=win_security_base EventCode=4662 (Properties="*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*" OR Properties="*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*" OR Properties="*89e95b76-444d-4c62-991a-0facbeda640c*")

## New Domain Admin / privileged group membership change -- Windows Events
## 4720 (user created, already covered by the add-on's windows_account_created)
## + 4728/4732/4756 (member added to a global/local/universal security
## group). Splunk_TA_windows' own windows_security_change_account eventtype
## includes 4732 but not 4728/4756 -- Domain Admins is a global group
## (4728) and Enterprise Admins is universal (4756), so that eventtype
## alone would miss half of this detection's real targets.
[dt_privileged_group_membership_change]
search = eventtype=win_security_base EventCode IN (4728,4732,4756)

## Base for the "directory service object modified" family below --
## Windows Events 5136.
[dt_ds_object_modified]
search = eventtype=win_security_base EventCode=5136

## Base for the "directory service object created" family below --
## Windows Events 5137.
[dt_ds_object_created]
search = eventtype=win_security_base EventCode=5137

## RBCD configuration write -- Windows Events 5136 (msDS-AllowedToActOnBehalfOfOtherIdentity)
[dt_rbcd_configured]
search = eventtype=dt_ds_object_modified AttributeLDAPDisplayName="msDS-AllowedToActOnBehalfOfOtherIdentity"

## Shadow Credentials (KeyCredentialLink abuse) -- Windows Events 5136 (msDS-KeyCredentialLink)
[dt_shadow_credentials]
search = eventtype=dt_ds_object_modified AttributeLDAPDisplayName="msDS-KeyCredentialLink"

## ACL / delegation abuse (DACL rights granted) -- Windows Events 5136 (nTSecurityDescriptor)
[dt_acl_dacl_modified]
search = eventtype=dt_ds_object_modified AttributeLDAPDisplayName="nTSecurityDescriptor"

## Logon script or ScriptPath tampering (the 5136 half -- pair with
## dt_object_access_completed below for the NETLOGON-script-write half) --
## Windows Events 5136 (scriptPath)
[dt_scriptpath_modified]
search = eventtype=dt_ds_object_modified AttributeLDAPDisplayName="scriptPath"

## Attacker-added DNS record -- Windows Events 5137 (directory service
## object created, DNS zone partition). ObjectClass=dnsNode narrows this to
## actual DNS records rather than any object created anywhere in AD.
[dt_dns_record_created]
search = eventtype=dt_ds_object_created ObjectClass="dnsNode"

## Base for NETLOGON/GPP/file-share-dump detections below -- Windows Events
## 5145 (detailed file share). backlog.md doesn't give a distinguishing
## ShareName/RelativeTargetName per scenario, so this stays a single base
## eventtype -- narrow further with those fields per specific detection.
[dt_detailed_file_share]
search = eventtype=win_security_base EventCode=5145

## Base for the hive/file/registry SACL-completion detections below --
## Windows Events 4663 (object access completed). Splunk_TA_windows only
## defines an eventtype for 4656 (access requested), not 4663 (the
## completion event these detections actually key on) -- confirmed gap.
[dt_object_access_completed]
search = eventtype=win_security_base EventCode=4663

## SAM hive dumping (registry SACL half -- pair with dt_vss_shadow_copy_created
## below for the shadow-copy-read path) -- Windows Events 4663 on HKLM\SAM /
## %SystemRoot%\System32\config\SAM
[dt_sam_hive_access]
search = eventtype=dt_object_access_completed (ObjectName="*\\SAM" OR ObjectName="*\\config\\SAM")

## LSA hive dumping (incl. LSA secrets), registry SACL half -- Windows
## Events 4663 on HKLM\SECURITY / %SystemRoot%\System32\config\SECURITY
[dt_lsa_hive_access]
search = eventtype=dt_object_access_completed (ObjectName="*\\SECURITY" OR ObjectName="*\\config\\SECURITY")

## NTDS.dit extraction (SACL half -- pair with dt_vss_shadow_copy_created
## below) -- Windows Events 4663 on %SystemRoot%\NTDS\ntds.dit
[dt_ntds_dit_access]
search = eventtype=dt_object_access_completed ObjectName="*\\NTDS\\ntds.dit"

## DPAPI masterkey / credential file theft -- Windows Events 4663, SACL on
## the Protect and Credentials folders (per-user AppData paths, hence the
## broad wildcard rather than one fixed system path).
[dt_dpapi_credential_access]
search = eventtype=dt_object_access_completed (ObjectName="*\\Microsoft\\Protect\\*" OR ObjectName="*\\Microsoft\\Credentials\\*")

## VSS/shadow-copy creation -- the read path for SAM/LSA/NTDS.dit dumping
## via vssadmin/wmic/PowerShell, all uniformly visible here regardless of
## which tool triggered it. UNCONFIRMED: built from the documented
## WMI-Activity/Operational message format for an ExecMethod call, not
## verified live against an actual triggered Win32_ShadowCopy Create (no
## add-on defines field extraction for this channel at all -- this is a
## raw-text match, refine once you have a real captured event to check the
## exact wording against).
[dt_vss_shadow_copy_created]
search = index=windows source="WinEventLog:Microsoft-Windows-WMI-Activity/Operational" "Win32_ShadowCopy" "Create"

## NetNTLMv1 permitted -- Windows Events 4624, Package Name (NTLM only) =
## NTLM V1. windows_logon_success (Splunk_TA_windows) covers 4624 generally;
## this narrows to the exact field/value backlog.md specifies.
[dt_ntlmv1_logon]
search = eventtype=windows_logon_success "Package Name (NTLM only)"="NTLM V1"

## LSASS memory access (mimikatz sekurlsa, Rubeus ticket dumping) -- Sysmon
## Event 10 (ProcessAccess), target=lsass.exe, GrantedAccess masks
## associated with credential reading, allowlisted accessors excluded.
## Splunk_TA_microsoft_sysmon's own ms-sysmon-process eventtype bundles
## Event 10 in with 10 other unrelated event codes -- not fine-grained
## enough to use directly for this detection.
[dt_sysmon_lsass_access]
search = source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=10 TargetImage="*\\lsass.exe" GrantedAccess IN ("0x1010","0x1038","0x1400","0x1438","0x143a") NOT (SourceImage="*\\MsMpEng.exe" OR SourceImage="*\\WmiPrvSE.exe")

## Coercion trigger (PetitPotam / DFSCoerce / ShadowCoerce / PrinterBug) --
## Sysmon Events 17/18 (named pipe created/connected), filtered to the
## specific pipes each technique binds over. pipe_name is
## Splunk_TA_microsoft_sysmon's own FIELDALIAS for PipeName.
[dt_sysmon_coercion_pipe]
search = source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode IN (17,18) pipe_name IN ("\\PIPE\\efsrpc","\\PIPE\\lsarpc","\\PIPE\\netdfs","\\PIPE\\FssagentRpc","\\PIPE\\spoolss")

## Remote scheduled task creation / Local scheduled task persistence --
## Windows Events 4698 alone. Splunk_TA_windows' windows_security_change
## eventtype bundles 4698 with 11 other, unrelated GPO/certificate-services
## event codes -- too broad for either of these two detections to use
## directly.
[dt_scheduled_task_created]
search = eventtype=win_security_base EventCode=4698

## LDAP query content (via 1644 diagnostics) -- Windows Events 1644 on the
## Directory Service log. Also the base 1644 correlates back into for the
## LDAPS and ADWS query-content detections (see backlog.md -- those two
## alert from Zeek conn.log on a non-domain-joined IP touching 636/9389,
## then join to this eventtype by timestamp).
[dt_ldap_1644_query]
search = eventtype=wineventlog-ds EventCode=1644

## --- SQL Server (monitoring rollout plan step 4 follow-up, 2026-09-27) ---
## All four backed by cyber-range's detection_sql_text Extended Events
## session (rpc_completed/sql_batch_completed with full statement text) and
## detection_impersonation_audit Server Audit -- see that repo's CLAUDE.md,
## "SQL Server telemetry + Certificate Services auditing", and this repo's
## dt_detection_content_macros.conf (mssql_xe_text/mssql_audit) for the
## underlying index/sourcetype.

## `xp_cmdshell` execution
[dt_sql_xp_cmdshell]
search = `mssql_xe_text` sql_text="*xp_cmdshell*"

## `xp_dirtree` execution
[dt_sql_xp_dirtree]
search = `mssql_xe_text` sql_text="*xp_dirtree*"

## Linked server command execution -- OPENQUERY/EXECUTE AT/four-part-name
## calls all contain one of these keywords in the batch/rpc text.
[dt_sql_linked_server_execution]
search = `mssql_xe_text` (sql_text="*OPENQUERY*" OR sql_text="*EXECUTE AT*" OR sql_text="*EXEC AT*")

## `EXECUTE AS` impersonation -- action_id="IMP" confirmed live (cyber-range's
## own verification: EXECUTE AS LOGIN = 'sa' produced action_id='IMP',
## server_principal_name='SQL1\Administrator'). Only server-level
## impersonation (EXECUTE AS LOGIN) has been observed so far -- if
## database-level impersonation (EXECUTE AS USER) turns out to use a
## different action_id, add it here once confirmed rather than guessing.
[dt_sql_execute_as_impersonation]
search = `mssql_audit` action_id="IMP"
