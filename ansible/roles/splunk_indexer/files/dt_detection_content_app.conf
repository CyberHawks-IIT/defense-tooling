# Deployed by the splunk_indexer role to dt_detection_content/default/app.conf.
# A minimal, valid app.conf so Splunk recognizes this as a real app rather
# than a bare config drop.
[install]
is_configured = 0

[ui]
is_visible = 0
label = Defense Tooling - Detection Content

[launcher]
author = defense-tooling
description = Indexes, macros, and eventtypes supporting splunk-detections/detections/backlog.md. Not a data-collecting add-on -- see CLAUDE.md's monitoring rollout plan step 4.
version = 1.0.0
