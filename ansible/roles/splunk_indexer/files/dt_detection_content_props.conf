# Deployed by the splunk_indexer role to dt_detection_content/local/props.conf.
#
# Search-time delimiter-based field extraction for Zeek TSV logs, via
# REPORT-class transforms (see dt_detection_content_transforms.conf in this
# same directory for the DELIMS/FIELDS stanzas this references).
#
# Splunk_TA_zeek's own INDEXED_EXTRACTIONS = tsv path is not used here --
# confirmed live 2026-09-27 that Splunk's CsvLineBreaker logs repeated "has
# extra incorrect columns in certain fields" warnings against this range's
# real conn.log/dns.log data and silently produces zero extracted fields, on
# both the indexer and (INDEXED_EXTRACTIONS' documented required location)
# the forwarder itself. A bare FIELD_DELIMITER/FIELD_NAMES in props.conf
# (tried next) turned out to be a companion setting for INDEXED_EXTRACTIONS'
# own header parsing, not an independent search-time mechanism -- it also
# silently extracted nothing. REPORT + transforms.conf DELIMS/FIELDS is the
# actual standalone search-time delimiter extraction path. See
# docs/add-ons.md and CLAUDE.md's Zeek sourcetype/field-extraction incident
# writeup for the full debugging trail.
#
# FIELDS lists below are each log's real #fields header, read directly from
# this deployment's own /opt/zeek/logs/current/*.log (conn, dns) or Zeek's
# standard default field order (dce_rpc, kerberos) where that log type had
# no live traffic yet to read a header from when this was written --
# reverify against a real header if a detection using these fields doesn't
# behave as expected. ldap.log intentionally omitted until a real header can
# be read (it comes from a third-party Zeek package, not core Zeek, so field
# order isn't a safe assumption).
[zeek:conn]
REPORT-zeek_fields = zeek_conn_fields

[zeek:dns]
REPORT-zeek_fields = zeek_dns_fields

[zeek:dce_rpc]
REPORT-zeek_fields = zeek_dce_rpc_fields

[zeek:kerberos]
REPORT-zeek_fields = zeek_kerberos_fields
