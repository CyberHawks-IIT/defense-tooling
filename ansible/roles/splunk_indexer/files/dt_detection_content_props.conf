# Deployed by the splunk_indexer role to dt_detection_content/local/props.conf.
#
# Search-time delimiter-based field extraction for Zeek TSV logs, via
# REPORT-class transforms (see dt_detection_content_transforms.conf in this
# same directory for the DELIMS/FIELDS stanzas this references).
#
# Splunk_TA_zeek's own INDEXED_EXTRACTIONS = tsv path is not used here --
# confirmed live 2026-09-27 that Splunk's CsvLineBreaker logs repeated "has
# extra incorrect columns in certain fields" warnings against this range's
# real conn.log/dns.log data and silently produces zero extracted fields, on
# both the indexer and (INDEXED_EXTRACTIONS' documented required location)
# the forwarder itself. A bare FIELD_DELIMITER/FIELD_NAMES in props.conf
# (tried next) turned out to be a companion setting for INDEXED_EXTRACTIONS'
# own header parsing, not an independent search-time mechanism -- it also
# silently extracted nothing. REPORT + transforms.conf DELIMS/FIELDS is the
# actual standalone search-time delimiter extraction path. See
# docs/add-ons.md and CLAUDE.md's Zeek sourcetype/field-extraction incident
# writeup for the full debugging trail.
#
# FIELDS lists below are each log's real #fields header, read directly from
# this deployment's own /opt/zeek/logs/current/*.log (conn, dns, ldap -- the
# last read 2026-09-27 once the LDAP Query detection's first live test
# produced real traffic) or Zeek's standard default field order (dce_rpc,
# kerberos) where that log type had no live traffic yet to read a header
# from when this was written -- reverify against a real header if a
# detection using these fields doesn't behave as expected.
[zeek:conn]
REPORT-zeek_fields = zeek_conn_fields

[zeek:dns]
REPORT-zeek_fields = zeek_dns_fields

[zeek:dce_rpc]
REPORT-zeek_fields = zeek_dce_rpc_fields

[zeek:kerberos]
REPORT-zeek_fields = zeek_kerberos_fields

[zeek:ldap]
REPORT-zeek_fields = zeek_ldap_fields

# Timestamp fix (2026-09-29). Splunk_TA_zeek's [zeek] stanza assigns _time via
# INDEXED_EXTRACTIONS=tsv + TIMESTAMP_FIELDS=ts. But INDEXED_EXTRACTIONS parses
# zero fields against this range's real Zeek TSV (the exact reason the REPORT-
# based search-time extraction above exists), so `ts` was never available at
# parse time and every Zeek event got stamped at INDEX time instead -- observed
# 5-330s late and minute-rounded, which silently broke sub-minute correlation
# (the ADWS 9389 time-join in LDAP Query, the SQL/ADCS conn.log joins). Zeek's
# `ts` epoch is always the first tab-delimited field of every log line, so pull
# the timestamp straight off the raw line (TIME_PREFIX=^ + TIME_FORMAT=%s.%6N)
# and turn the broken structured-extraction timestamp path OFF. This is an
# attribute-level override of the TA's [zeek] stanza: TRANSFORMS-autotype
# (retype by filename) and TrashComments (drop the #-prefixed header lines to
# nullQueue) are inherited unchanged, so clearing INDEXED_EXTRACTIONS does not
# start indexing the #fields/#separator header lines. _time is now the real
# connection time; detections still use `ts` for math finer than 1s.
#
# Clearing INDEXED_EXTRACTIONS alone is NOT enough: the TA's [zeek] stanza also
# sets FIELD_DELIMITER / FIELD_HEADER_REGEX / HEADER_FIELD_DELIMITER, and while
# any of those survive, Splunk keeps the source in structured-parsing mode and
# ignores TIME_PREFIX/TIME_FORMAT entirely (the aggregator hands timestamping
# to the structured extractor, which can't parse `ts` and falls back to current
# time). Verified live 2026-09-29 with oneshot tests: the epoch was ignored
# until all three companions were also cleared. They must be blanked here too.
#
# The load-bearing one is TIMESTAMP_FIELDS: the TA sets TIMESTAMP_FIELDS=ts on
# [zeek], which tells Splunk to read _time from an already-extracted structured
# field named `ts`. With indexed extraction off, no such field exists at parse
# time, so Splunk silently stamps the event with the current time and NEVER
# falls through to TIME_PREFIX/TIME_FORMAT (no DateParser warning is logged).
# Clearing TIMESTAMP_FIELDS is what actually lets the TIME_PREFIX path run.
# (Confirmed live: a oneshot assigned directly to sourcetype zeek:conn, which
# the TA does not give a TIMESTAMP_FIELDS, parsed the epoch correctly, while
# the same line entering as `zeek` and renamed via autotype did not.)
[zeek]
INDEXED_EXTRACTIONS =
TIMESTAMP_FIELDS =
FIELD_DELIMITER =
FIELD_HEADER_REGEX =
HEADER_FIELD_DELIMITER =
TIME_PREFIX = ^
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 32
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
