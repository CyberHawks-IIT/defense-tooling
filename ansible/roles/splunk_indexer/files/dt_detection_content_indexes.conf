# Deployed by the splunk_indexer role to dt_detection_content/local/indexes.conf.
#
# Separates data by source rather than leaving everything in the "main"
# default index -- see CLAUDE.md's monitoring rollout plan step 4 for the
# reasoning. "main" itself is untouched (still exists, just unused going
# forward -- nothing here deletes it or migrates its existing contents).
#
# Retention (2026-10-09): short and size-bounded on purpose. The indexer has a
# 16 GB disk and Splunk stops BOTH searching and indexing when free space
# drops under 5000 MB (server.conf minFreeSpace), which silently halted every
# detection for ~26 h on 2026-10-08. Long log storage isn't wanted here, so
# every index ages out by time and is capped by size, and the caps add up to
# ~3.5 GB, leaving room for the Splunk install, KV store and dispatch dir.
#
# A size cap only works if buckets actually roll. Splunk can freeze (delete)
# only warm/cold buckets, never hot ones, and by default a hot bucket stays
# open until it reaches ~750 MB-10 GB or 90 days. That made the earlier caps
# unenforceable: _introspection sat at 2.7 GB against a 1 GB cap, all in hot
# buckets. So every index here gets small buckets (maxDataSize) that close at
# least daily (maxHotSpanSecs), and the cap/age then trims them continuously.
#
# Detection data keeps 14 days: the longest lookback any detection uses is
# 7 days (SQL statement -> login session trace). Splunk's own internal
# indexes keep 7 days.

# Backstop for any index not listed below (main, summary, _telemetry,
# _configtracker, ...). Explicit per-index stanzas below override it, and so
# do settings Splunk's own system/default stanzas set per index, which is why
# the internal indexes are all listed explicitly.
[default]
maxDataSize            = 100
maxHotSpanSecs         = 86400
frozenTimePeriodInSecs = 1209600
maxTotalDataSizeMB     = 128

[zeek]
homePath   = $SPLUNK_DB/zeek/db
coldPath   = $SPLUNK_DB/zeek/colddb
thawedPath = $SPLUNK_DB/zeek/thaweddb
maxTotalDataSizeMB = 768

[windows]
homePath   = $SPLUNK_DB/windows/db
coldPath   = $SPLUNK_DB/windows/colddb
thawedPath = $SPLUNK_DB/windows/thaweddb
maxTotalDataSizeMB = 768

[linux]
homePath   = $SPLUNK_DB/linux/db
coldPath   = $SPLUNK_DB/linux/colddb
thawedPath = $SPLUNK_DB/linux/thaweddb

# Added in the step-4 follow-up (SQL Server + IIS ingestion) -- kept
# separate from "windows" even though both run on Windows hosts, since
# they're a genuinely different data domain (database audit trail /
# web server access log, not host security events) with their own
# likely-different retention and access-control needs.
[mssql]
homePath   = $SPLUNK_DB/mssql/db
coldPath   = $SPLUNK_DB/mssql/colddb
thawedPath = $SPLUNK_DB/mssql/thaweddb

[iis]
homePath   = $SPLUNK_DB/iis/db
coldPath   = $SPLUNK_DB/iis/colddb
thawedPath = $SPLUNK_DB/iis/thaweddb

# Splunk's own internal indexes. The detections run every 15 seconds (~200
# searches a minute) and every run writes audit, scheduler and resource-usage
# records: measured ~570 MB/day into _introspection and ~300 MB/day into
# _audit. Each is listed explicitly because system/default sets its own
# bucket size, hot span and retention per internal index.
[_internal]
maxDataSize            = 100
maxHotSpanSecs         = 86400
frozenTimePeriodInSecs = 604800
maxTotalDataSizeMB     = 768

[_audit]
maxDataSize            = 100
maxHotSpanSecs         = 86400
frozenTimePeriodInSecs = 604800
maxTotalDataSizeMB     = 384

[_introspection]
maxDataSize            = 100
maxHotSpanSecs         = 86400
frozenTimePeriodInSecs = 604800
maxTotalDataSizeMB     = 256

[_metrics]
maxDataSize            = 100
maxHotSpanSecs         = 86400
frozenTimePeriodInSecs = 604800
maxTotalDataSizeMB     = 128

[_metrics_rollup]
maxDataSize            = 100
maxHotSpanSecs         = 86400
frozenTimePeriodInSecs = 604800
maxTotalDataSizeMB     = 64
