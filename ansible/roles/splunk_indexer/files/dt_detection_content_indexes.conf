# Deployed by the splunk_indexer role to dt_detection_content/local/indexes.conf.
#
# Separates data by source rather than leaving everything in the "main"
# default index -- see CLAUDE.md's monitoring rollout plan step 4 for the
# reasoning. "main" itself is untouched (still exists, just unused going
# forward -- nothing here deletes it or migrates its existing contents).
# Retention left at Splunk's defaults (no frozenTimePeriodInSecs override) --
# this is a lab-scale deployment, not a capacity-constrained production one.
[zeek]
homePath   = $SPLUNK_DB/zeek/db
coldPath   = $SPLUNK_DB/zeek/colddb
thawedPath = $SPLUNK_DB/zeek/thaweddb

[windows]
homePath   = $SPLUNK_DB/windows/db
coldPath   = $SPLUNK_DB/windows/colddb
thawedPath = $SPLUNK_DB/windows/thaweddb

[linux]
homePath   = $SPLUNK_DB/linux/db
coldPath   = $SPLUNK_DB/linux/colddb
thawedPath = $SPLUNK_DB/linux/thaweddb
