# Deployed by the splunk_indexer role to dt_detection_content/local/macros.conf.
#
# One macro per log source in splunk-detections/detections/backlog.md's
# "Zeek logs actually needed" table plus every Windows Event Log channel
# splunk_forwarder_windows now forwards (see CLAUDE.md's monitoring rollout
# plan step 3) and the demo box's auditd stream. Keeps index/source(type)
# names out of every detection's SPL -- if any changes later, fix it here
# once instead of in every search. No macros exist for IIS or SQL Server
# data since neither is actually being forwarded yet (see CLAUDE.md's open
# items) -- add them here when that data source comes online, not before.
#
# The win_* macros filter on `source`, not `sourcetype` -- confirmed live
# (CLAUDE.md's monitoring rollout plan step 4): Splunk_TA_windows's own
# ta-windows-fix-sourcetype transform collapses every classic/XML
# WinEventLog sourcetype down to a bare "WinEventLog"/"XmlWinEventLog"
# (no channel suffix) regardless of what inputs.conf originally set --
# `source` is where the full per-channel value (e.g.
# "WinEventLog:Security") actually survives, and is also what
# Splunk_TA_windows' own per-channel props.conf stanzas
# ([source::WinEventLog:Security], etc.) and eventtypes (e.g.
# wineventlog-ds) key on. A sourcetype-based filter here would silently
# match nothing.

[zeek_conn]
definition = index=zeek sourcetype="zeek:conn"
iseval = 0

[zeek_dns]
definition = index=zeek sourcetype="zeek:dns"
iseval = 0

[zeek_dce_rpc]
definition = index=zeek sourcetype="zeek:dce_rpc"
iseval = 0

[zeek_kerberos]
definition = index=zeek sourcetype="zeek:kerberos"
iseval = 0

[zeek_ldap]
definition = index=zeek sourcetype="zeek:ldap"
iseval = 0

[win_security]
definition = index=windows source="WinEventLog:Security"
iseval = 0

[win_system]
definition = index=windows source="WinEventLog:System"
iseval = 0

[win_directory_service]
definition = index=windows source="WinEventLog:Directory Service"
iseval = 0

[win_sysmon]
definition = index=windows source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
iseval = 0

[win_wmi_activity]
definition = index=windows source="WinEventLog:Microsoft-Windows-WMI-Activity/Operational"
iseval = 0

[win_winrm]
definition = index=windows source="WinEventLog:Microsoft-Windows-WinRM/Operational"
iseval = 0

[win_defender]
definition = index=windows source="WinEventLog:Microsoft-Windows-Windows Defender/Operational"
iseval = 0

[linux_shadow_audit]
definition = index=linux sourcetype=linux_audit
iseval = 0
