# Deployed by the splunk_indexer role to Splunk_TA_zeek/local/props.conf.
#
# Dynamically types every Zeek log file by its own filename (conn.log ->
# zeek:conn, kerberos.log -> zeek:kerberos, etc.) instead of hand-listing
# every possible Zeek log type. Works with any future Zeek log type with no
# config changes. See transforms.conf in this same directory for the regex,
# and CLAUDE.md's "Dynamic Zeek sourcetype assignment" section in
# defense-tooling for the full reasoning.
[source::.../zeek/logs/*/*.log]
TRANSFORMS-zeek_dynamic_sourcetype = zeek_set_sourcetype
