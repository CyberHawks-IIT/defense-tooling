# Deployed by the splunk_indexer role to dt_detection_content/local/transforms.conf.
#
# Defines the known_range_hosts lookup table (backed by
# dt_detection_content_known_hosts.csv) -- the cyberhawks.lab `ad` segment's
# fixed IP assignments (see cyber-range's CLAUDE.md "Range VMs" table and
# the computer/computer2-5 static-IP block), used by the NTLM-relay and
# unusual-source-IP detections in backlog.md (relayed SMB/LDAP, non-domain-
# joined IP touching LDAPS/ADWS) to distinguish a known host from anything
# else. Usage in a detection: `| lookup known_range_hosts ip AS src_ip
# OUTPUT hostname` then filter on `isnull(hostname)` for "not a known host".
[known_range_hosts]
filename = dt_detection_content_known_hosts.csv
