# Deployed by the splunk_indexer role to dt_detection_content/local/transforms.conf.
#
# Defines the known_range_hosts lookup table (backed by
# dt_detection_content_known_hosts.csv) -- the cyberhawks.lab `ad` segment's
# fixed IP assignments (see cyber-range's CLAUDE.md "Range VMs" table and
# the computer/computer2-5 static-IP block), used by the NTLM-relay and
# unusual-source-IP detections in backlog.md (relayed SMB/LDAP, non-domain-
# joined IP touching LDAPS/ADWS) to distinguish a known host from anything
# else. Usage in a detection: `| lookup known_range_hosts ip AS src_ip
# OUTPUT hostname` then filter on `isnull(hostname)` for "not a known host".
[known_range_hosts]
filename = dt_detection_content_known_hosts.csv

# Search-time delimiter-based field extraction for Zeek TSV logs -- see
# dt_detection_content_props.conf's REPORT-zeek_fields references and its
# comment for why this exists instead of Splunk_TA_zeek's own
# INDEXED_EXTRACTIONS. FIELDS lists match each log's real #fields header
# (or Zeek's standard default order where no live traffic existed yet to
# read one from -- see that file's comment).
#
# CONFIRMED LIVE 2026-09-27: Splunk silently normalizes a dotted field name
# declared here (e.g. "id.orig_h") to underscores at search time
# (id_orig_h). Detections/SPL in splunk-detections must reference the
# underscore form (id_orig_h, id_resp_h, id_resp_p, orig_l2_addr, etc.), NOT
# the dotted Zeek/CIM convention used in backlog.md's prose descriptions.
[zeek_conn_fields]
DELIMS = "\t"
FIELDS = "ts","uid","id.orig_h","id.orig_p","id.resp_h","id.resp_p","proto","service","duration","orig_bytes","resp_bytes","conn_state","local_orig","local_resp","missed_bytes","history","orig_pkts","orig_ip_bytes","resp_pkts","resp_ip_bytes","tunnel_parents","ip_proto","orig_l2_addr","resp_l2_addr"

[zeek_dns_fields]
DELIMS = "\t"
FIELDS = "ts","uid","id.orig_h","id.orig_p","id.resp_h","id.resp_p","proto","trans_id","rtt","query","qclass","qclass_name","qtype","qtype_name","rcode","rcode_name","AA","TC","RD","RA","Z","answers","TTLs","rejected","opcode","opcode_name"

[zeek_dce_rpc_fields]
DELIMS = "\t"
FIELDS = "ts","uid","id.orig_h","id.orig_p","id.resp_h","id.resp_p","rtt","named_pipe","endpoint","operation"

[zeek_kerberos_fields]
DELIMS = "\t"
FIELDS = "ts","uid","id.orig_h","id.orig_p","id.resp_h","id.resp_p","request_type","client","service","success","error_msg","from","till","cipher","forwardable","renewable","client_cert_subject","client_cert_fuid","server_cert_subject","server_cert_fuid"

[zeek_ldap_fields]
DELIMS = "\t"
FIELDS = "ts","uid","id.orig_h","id.orig_p","id.resp_h","id.resp_p","message_id","version","opcode","result","diagnostic_message","object","argument"

[zeek_conn_open_fields]
DELIMS = "\t"
FIELDS = "ts","uid","id.orig_h","id.orig_p","id.resp_h","id.resp_p"

[zeek_arp_request_fields]
DELIMS = "\t"
FIELDS = "ts","orig_mac","orig_h","resp_h"
