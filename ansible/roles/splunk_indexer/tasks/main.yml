---
- name: Check whether Splunk is already installed
  ansible.builtin.stat:
    path: "{{ splunk_home }}/bin/splunk"
  register: splunk_binary

- name: Assert splunk_deb_path is set for first-time install
  ansible.builtin.assert:
    that: splunk_deb_path | length > 0
    fail_msg: >-
      splunk_deb_path is not set. Download Splunk Enterprise yourself
      (see docs/add-ons.md — it requires a splunk.com login) and set
      splunk_deb_path to the local .deb file's path.
  when: not splunk_binary.stat.exists

- name: Copy the Splunk Enterprise package to the indexer
  ansible.builtin.copy:
    src: "{{ splunk_deb_path }}"
    dest: /tmp/splunk-enterprise.deb
    mode: "0644"
  when: not splunk_binary.stat.exists

- name: Install the Splunk Enterprise package
  ansible.builtin.apt:
    deb: /tmp/splunk-enterprise.deb
  when: not splunk_binary.stat.exists

- name: Check whether Splunk has already been initialized (first-start already run)
  ansible.builtin.stat:
    path: "{{ splunk_home }}/etc/passwd"
  register: splunk_initialized

- name: Assert splunk_admin_password is set for first-time initialization
  ansible.builtin.assert:
    that: splunk_admin_password | length > 0
    fail_msg: "splunk_admin_password must be set for Splunk's first start (seeds the admin account)."
  when: not splunk_initialized.stat.exists

- name: First-time start — accept license and seed the admin password
  ansible.builtin.command: >
    {{ splunk_home }}/bin/splunk start
    --accept-license --answer-yes --no-prompt
    --seed-passwd {{ splunk_admin_password | quote }}
  when: not splunk_initialized.stat.exists
  changed_when: true
  become: false  # run as the connecting user, NOT root -- splunkd refuses
                 # to actually start as root (fails silently under `become`,
                 # only a "deprecated" warning with no further output) unless
                 # --run-as-root is also passed, which we deliberately don't
                 # want since splunkd should run as ansible_user long-term.

# `enable boot-start` itself needs root (it writes /etc/init.d and registers
# with update-rc.d), but -user here controls who splunkd actually runs AS
# once started by that init script -- without it, the generated systemd/init
# integration launches splunkd as root, which then fails outright on every
# boot (confirmed live: `systemctl status splunk` showed a clean "failed,
# exit-code 1" with the same root-deprecation message, and never retried).
- name: Enable boot-start (running as {{ ansible_user }}, not root)
  ansible.builtin.command: >
    {{ splunk_home }}/bin/splunk enable boot-start
    -user {{ ansible_user }} --accept-license
  register: boot_start_result
  changed_when: "'is already configured to start' not in boot_start_result.stdout"

- name: Ensure etc/system/local exists
  ansible.builtin.file:
    path: "{{ splunk_home }}/etc/system/local"
    state: directory
    mode: "0755"

- name: Configure the receiving port for forwarders
  ansible.builtin.copy:
    dest: "{{ splunk_home }}/etc/system/local/inputs.conf"
    content: |
      [splunktcp://{{ splunk_receiving_port }}]
      disabled = 0
    mode: "0644"
  notify: restart splunk

- name: Deploy add-ons from the local add-ons directory
  when: splunk_addons_dir | length > 0
  block:
    - name: Find add-on packages on the control node
      ansible.builtin.find:
        paths: "{{ splunk_addons_dir }}"
        patterns: ["*.tgz", "*.spl"]
      delegate_to: localhost
      register: addon_files

    - name: Extract each add-on into $SPLUNK_HOME/etc/apps
      ansible.builtin.unarchive:
        src: "{{ item.path }}"
        dest: "{{ splunk_home }}/etc/apps/"
        remote_src: false
      loop: "{{ addon_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      notify: restart splunk

- name: Deploy detection-content knowledge objects (indexes/macros/eventtypes/lookup for splunk-detections)
  when: splunk_deploy_detection_content
  block:
    - name: Ensure dt_detection_content app directories exist
      ansible.builtin.file:
        path: "{{ splunk_home }}/etc/apps/dt_detection_content/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - default
        - local
        - lookups
        - metadata

    - name: Deploy dt_detection_content/default/app.conf
      ansible.builtin.copy:
        src: dt_detection_content_app.conf
        dest: "{{ splunk_home }}/etc/apps/dt_detection_content/default/app.conf"
        mode: "0644"

    - name: Deploy dt_detection_content/metadata/default.meta (share knowledge objects globally)
      ansible.builtin.copy:
        src: dt_detection_content_default.meta
        dest: "{{ splunk_home }}/etc/apps/dt_detection_content/metadata/default.meta"
        mode: "0644"
      notify: restart splunk

    - name: Deploy dt_detection_content/local/indexes.conf (zeek/windows/linux indexes)
      ansible.builtin.copy:
        src: dt_detection_content_indexes.conf
        dest: "{{ splunk_home }}/etc/apps/dt_detection_content/local/indexes.conf"
        mode: "0644"
      notify: restart splunk

    - name: Deploy dt_detection_content/local/macros.conf
      ansible.builtin.copy:
        src: dt_detection_content_macros.conf
        dest: "{{ splunk_home }}/etc/apps/dt_detection_content/local/macros.conf"
        mode: "0644"
      notify: restart splunk

    - name: Deploy dt_detection_content/local/eventtypes.conf
      ansible.builtin.copy:
        src: dt_detection_content_eventtypes.conf
        dest: "{{ splunk_home }}/etc/apps/dt_detection_content/local/eventtypes.conf"
        mode: "0644"
      notify: restart splunk

    - name: Deploy dt_detection_content/local/transforms.conf (known_range_hosts lookup definition)
      ansible.builtin.copy:
        src: dt_detection_content_transforms.conf
        dest: "{{ splunk_home }}/etc/apps/dt_detection_content/local/transforms.conf"
        mode: "0644"
      notify: restart splunk

    - name: Deploy dt_detection_content/lookups/dt_detection_content_known_hosts.csv
      ansible.builtin.copy:
        src: dt_detection_content_known_hosts.csv
        dest: "{{ splunk_home }}/etc/apps/dt_detection_content/lookups/dt_detection_content_known_hosts.csv"
        mode: "0644"
      notify: restart splunk

- name: Configure Splunk DB Connect for SQL Server telemetry (see CLAUDE.md, monitoring rollout plan step 4 follow-up)
  when: splunk_deploy_mssql_dbconnect
  block:
    - name: Install a JRE for DB Connect's task server
      ansible.builtin.apt:
        name: "{{ splunk_dbconnect_java_package }}"
        state: present
      register: dbx_java_install

    - name: Download the Microsoft JDBC Driver for SQL Server
      ansible.builtin.get_url:
        url: "{{ splunk_dbconnect_jdbc_url }}"
        dest: "{{ splunk_home }}/etc/apps/splunk_app_db_connect/drivers/{{ splunk_dbconnect_jdbc_jar_name }}"
        mode: "0644"
      register: dbx_jdbc_download

    # DB Connect's own task server (running as {{ ansible_user }}, same as
    # splunkd itself, not root) needs write access under its own app
    # directory at runtime, for its internal secrets KV store collection
    # specifically. Confirmed live: without this, every identities/
    # connections/inputs REST call below fails -- splunkd.log shows
    # "Cannot open file for create or append: .../metadata/local.meta:
    # Permission denied", which surfaces as an HTTP 500 from DB Connect's
    # task server (visible to us as a 503 from the proxying REST call).
    # This is the one app in this role that needs it -- dt_detection_content
    # and Splunk_TA_zeek are read-only knowledge objects Splunk never
    # writes back into at runtime, so they don't hit this.
    - name: Ensure DB Connect's app directory is owned by the splunkd runtime user
      ansible.builtin.file:
        path: "{{ splunk_home }}/etc/apps/splunk_app_db_connect"
        state: directory
        recurse: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Restart Splunk so DB Connect picks up Java and the new driver
      ansible.builtin.command: "{{ splunk_home }}/bin/splunk restart"
      when: dbx_java_install.changed or dbx_jdbc_download.changed
      changed_when: true

    - name: Wait for DB Connect's task server to accept REST requests
      ansible.builtin.uri:
        url: "https://localhost:8089/servicesNS/nobody/splunk_app_db_connect/db_connect/dbxproxy/identities"
        method: GET
        user: "{{ splunk_dbconnect_admin_user }}"
        password: "{{ splunk_dbconnect_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: dbx_ready
      until: dbx_ready.status == 200
      retries: 20
      delay: 5

    - name: Check whether the svc_sqlmonitor identity already exists
      ansible.builtin.uri:
        url: "https://localhost:8089/servicesNS/nobody/splunk_app_db_connect/db_connect/dbxproxy/identities"
        method: GET
        user: "{{ splunk_dbconnect_admin_user }}"
        password: "{{ splunk_dbconnect_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: dbx_identities

    # identities.conf.spec documents `password` as "the encrypted value" --
    # unlike every other knowledge object this project templates directly,
    # DB Connect expects to receive the PLAINTEXT password itself only
    # through this API (which encrypts it server-side before writing
    # identities.conf); there's no supported way to pre-compute and
    # template the encrypted value ourselves.
    - name: Create the svc_sqlmonitor DB Connect identity
      ansible.builtin.uri:
        url: "https://localhost:8089/servicesNS/nobody/splunk_app_db_connect/db_connect/dbxproxy/identities"
        method: POST
        user: "{{ splunk_dbconnect_admin_user }}"
        password: "{{ splunk_dbconnect_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "{{ splunk_dbconnect_identity_name }}"
          username: "{{ splunk_dbconnect_sqlmonitor_username }}"
          password: "{{ splunk_dbconnect_sqlmonitor_password }}"
        status_code: [200, 201]
      when: (dbx_identities.json | selectattr('name', 'equalto', splunk_dbconnect_identity_name) | list | length) == 0

    # Unlike the identity above, connections and inputs hold no secrets --
    # a connection only references an identity by name, and every db_inputs
    # field is plain config -- so both are just conf-backed knowledge
    # objects like everything else this project templates directly.
    # Confirmed live: DB Connect's own dbxproxy REST validator for inputs
    # rejects field names copied straight from db_inputs.conf.spec (e.g.
    # tail_rising_column_name/index_time_mode) with opaque "must not be
    # null"/"Invalid index time mode" errors regardless of casing tried --
    # its minified frontend bundle uses yet another set of names
    # (risingColumnName, etc.) not documented anywhere. Writing the conf
    # files directly sidesteps that validator entirely and is what
    # actually got these two inputs running.
    - name: Deploy splunk_app_db_connect/local/db_connections.conf
      ansible.builtin.template:
        src: db_connections.conf.j2
        dest: "{{ splunk_home }}/etc/apps/splunk_app_db_connect/local/db_connections.conf"
        mode: "0644"
        owner: "{{ ansible_user }}"
      notify: restart splunk

    - name: Deploy splunk_app_db_connect/local/db_inputs.conf
      ansible.builtin.template:
        src: db_inputs.conf.j2
        dest: "{{ splunk_home }}/etc/apps/splunk_app_db_connect/local/db_inputs.conf"
        mode: "0644"
        owner: "{{ ansible_user }}"
      notify: restart splunk

- name: Deploy the Zeek dynamic-sourcetype mapping (requires Splunk_TA_zeek)
  when: splunk_deploy_zeek_sourcetype_mapping
  block:
    - name: Ensure Splunk_TA_zeek/local exists
      ansible.builtin.file:
        path: "{{ splunk_home }}/etc/apps/Splunk_TA_zeek/local"
        state: directory
        mode: "0755"

    - name: Deploy zeek sourcetype props.conf
      ansible.builtin.copy:
        src: zeek_sourcetype_props.conf
        dest: "{{ splunk_home }}/etc/apps/Splunk_TA_zeek/local/props.conf"
        mode: "0644"
      notify: restart splunk

    - name: Deploy zeek sourcetype transforms.conf
      ansible.builtin.copy:
        src: zeek_sourcetype_transforms.conf
        dest: "{{ splunk_home }}/etc/apps/Splunk_TA_zeek/local/transforms.conf"
        mode: "0644"
      notify: restart splunk
