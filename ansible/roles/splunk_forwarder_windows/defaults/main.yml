---
# Local path to a manually downloaded Universal Forwarder .msi — see
# ../../../docs/add-ons.md. Required; this role does not download it.
splunk_uf_win_msi_path: ""

# Seeded on first install only, same rules as splunk_forwarder's (Linux)
# admin password. Unlike the Linux role, the Windows UF's .msi installer
# takes this as an install-time property rather than a separate first-start
# step — see tasks/main.yml.
splunk_uf_win_admin_password: ""

splunk_uf_win_home: 'C:\Program Files\SplunkUniversalForwarder'

# Where the indexer is, and what port it's receiving on.
splunk_uf_win_indexer_host: ""
splunk_uf_win_indexer_port: 9997

# What to monitor and how to type it. Same "explicit allowlist, not a
# wildcard" rule as the Linux splunk_forwarder role's splunk_uf_monitor_files.
# Left empty by default — real per-deployment values live in inventory
# (group_vars/splunk_forwarders_windows/ for the set common to every AD
# member, host_vars/<dc>.yml for DC-only additions like Directory Service —
# see CLAUDE.md's monitoring rollout plan step 3 for the channel-vs-event-ID
# granularity decision behind this shape).
#
# Each entry is a dict:
#   channel:   the WinEventLog channel name, e.g. Security,
#              Microsoft-Windows-Sysmon/Operational
#   whitelist: optional. A comma-separated list of Event IDs (or ID ranges,
#              e.g. "5001-5013") to forward from that channel. Omit it to
#              forward the whole channel unfiltered — only appropriate for
#              channels that are already low-volume or already scoped at the
#              source (e.g. Sysmon, whose own config only emits the event
#              types we asked for). High-volume channels like Security
#              always need this set — see CLAUDE.md.
#
# Example:
#   splunk_uf_win_monitor_channels:
#     - channel: Security
#       whitelist: "1102,4624,4625,4656,4657,4662,4663,4697,4698,4720,4728,4732,4741,4756,4768,4769,4771,5136,5137,5145"
#     - channel: Microsoft-Windows-Sysmon/Operational
splunk_uf_win_monitor_channels: []

splunk_uf_win_sourcetype_placeholder: forwarded_logs
splunk_uf_win_index: main
